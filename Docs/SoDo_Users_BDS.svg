<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120"><rect width="100%" height="100%" fill="white"/><text x="62" y="75" font-family="DejaVu Sans, sans-serif" font-size="39" fill="#172638" font-weight="700">SƠ ĐỒ THAM CHIẾU USERS – BDS</text><text x="62" y="121" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#4d5b69" font-weight="400">Mã nghiệp vụ dùng để nối: MaUser và MaBDS. MongoDB _id độc lập.</text><rect x="62" y="166" width="615" height="680" rx="16" fill="#f8fafb" stroke="#d3dbe1" stroke-width="2"/><rect x="1123" y="166" width="615" height="680" rx="16" fill="#f8fafb" stroke="#d3dbe1" stroke-width="2"/><text x="91" y="231" font-family="DejaVu Sans, sans-serif" font-size="37" fill="#172638" font-weight="700">Users</text><text x="91" y="285" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172638" font-weight="400">_id: ObjectId</text><text x="91" y="332" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#237563" font-weight="700">MaUser: string (unique)</text><text x="91" y="383" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172638" font-weight="400">HoTen, Email, SDT, MatKhau</text><text x="91" y="426" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172638" font-weight="400">VaiTro, NgayTao, trạng thái</text><text x="91" y="508" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#172638" font-weight="700">Nội dung nhúng</text><text x="91" y="561" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172638" font-weight="400">ThongTinMoiGioi { ... }</text><text x="91" y="604" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#172638" font-weight="400">DanhGia [ { MaUserDanhGia,</text><text x="118" y="643" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#172638" font-weight="400">MaBDS?, SoSao, ... } ]</text><text x="91" y="699" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172638" font-weight="400">BDSDaLuu [ MaBDS, ... ]</text><text x="91" y="750" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172638" font-weight="400">ThongBao [ { MaBDS?,</text><text x="118" y="790" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172638" font-weight="400">MaLichHen?, DaDoc, ... } ]</text><text x="1152" y="231" font-family="DejaVu Sans, sans-serif" font-size="37" fill="#172638" font-weight="700">BDS</text><text x="1152" y="285" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172638" font-weight="400">_id: ObjectId</text><text x="1152" y="332" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#916b25" font-weight="700">MaBDS: string (unique)</text><text x="1152" y="410" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172638" font-weight="700">Các trường tham chiếu User</text><text x="1152" y="465" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172638" font-weight="400">MaChuSoHuu</text><text x="1152" y="510" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172638" font-weight="400">MaMoiGioi (có thể thiếu)</text><text x="1152" y="564" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172638" font-weight="400">LichSuGia [ { ...</text><text x="1180" y="605" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172638" font-weight="400">MaNguoiThayDoi } ]</text><text x="1152" y="689" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172638" font-weight="700">Thông tin bất động sản</text><text x="1152" y="742" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172638" font-weight="400">Địa chỉ, giá, loại, hình ảnh,</text><text x="1152" y="784" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#172638" font-weight="400">thuộc tính riêng, giao dịch</text><polyline points="1123,337 1020,337 1020,343 677,343" fill="none" stroke="#237563" stroke-width="4" stroke-linejoin="round"/><polygon points="677,343 692.7964861140267,334.37034030512433 692.7964861140267,351.62965969487567" fill="#237563"/><text x="717" y="261" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#237563" font-weight="700">BDS → Users.MaUser</text><text x="717" y="300" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#237563" font-weight="400">Chủ sở hữu / môi giới /</text><text x="717" y="331" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#237563" font-weight="400">người thay đổi giá</text><polyline points="677,680 1030,680 1030,638 1123,638" fill="none" stroke="#916b25" stroke-width="4" stroke-linejoin="round"/><polygon points="1123,638 1107.2035138859733,646.6296596948756 1107.2035138859733,629.3703403051244" fill="#916b25"/><text x="717" y="566" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#916b25" font-weight="700">Users → BDS.MaBDS</text><text x="717" y="609" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#916b25" font-weight="400">Tin đã lưu / đánh giá /</text><text x="717" y="643" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#916b25" font-weight="400">thông báo về BĐS</text><polyline points="62,598 25,598 25,337 62,337" fill="none" stroke="#237563" stroke-width="4" stroke-linejoin="round"/><polygon points="62,337 46.203513885973294,345.62965969487567 46.203513885973294,328.37034030512433" fill="#237563"/><text x="62" y="907" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#237563" font-weight="400">Tự tham chiếu: DanhGia[].MaUserDanhGia → Users.MaUser</text><text x="62" y="967" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#4d5b69" font-weight="400">Chỉ môi giới có ThongTinMoiGioi; các mảng nằm trong document User.</text><text x="62" y="1015" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#4d5b69" font-weight="400">MaBDS? và MaLichHen? là trường tùy chọn. MaLichHen chưa có collection trong nguồn.</text><text x="62" y="1061" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#4d5b69" font-weight="400">Quan hệ do ứng dụng kiểm tra; MongoDB không tự áp đặt khóa ngoại.</text></svg>